# Keeps the free Supabase database from pausing while the shop has few visitors.
# Supabase pauses free projects after about a week with little database activity,
# so once a day this reads one row (the supermarket list), like a visitor would.
# The key below is the PUBLISHABLE key: it is public by design (every visitor's
# browser has it) and can only read what the database's safety rules allow.
name: Keep database awake

on:
  schedule:
    - cron: "17 6 * * *" # every day, 06:17 UTC (7:17 in Lagos)
  workflow_dispatch: {} # also runnable by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}"             "https://cqoqudkqikbfaeuashrh.supabase.co/rest/v1/stores?select=id&limit=1"             -H "apikey: sb_publishable_E4bwwRMrqnQEcTKP73btcQ_HeCsu0W2")
          echo "Database answered: $code"
          test "$code" = "200"
