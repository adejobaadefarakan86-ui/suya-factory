<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffdf9">
<title>No connection · Suya Factory</title>
<style>
  :root { --bg: #fffdf9; --ink: #18130e; --muted: #6e6357; --accent: #e4570f; --accent-strong: #c2410c; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15110d; --ink: #f6eee3; --muted: #b3a797; --accent: #ff7a2e; --accent-strong: #ff9150; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left)) 24px max(16px, env(safe-area-inset-right));
    background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%), var(--bg);
    color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
  }
  main { max-width: 22rem; }
  svg { width: 88px; height: 88px; }
  h1 { margin: 20px 0 8px; font-size: 1.6rem; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--muted); line-height: 1.55; }
  button {
    margin-top: 28px; border: 0; border-radius: 12px; padding: 14px 28px; font: inherit; font-weight: 600;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  small { display: block; margin-top: 18px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <svg viewBox="0 -3 64 64" aria-hidden="true">
    <defs><linearGradient id="h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2402f"/><stop offset="1" stop-color="#f2892e"/></linearGradient></defs>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="url(#h)" stroke-width="2.6" d="M24 4c-1.8 1.4-1.8 3 0 4.4s1.8 3 0 4.4"/>
      <path stroke="url(#h)" stroke-width="2.6" d="M32 4c-1.8 1.4-1.8 3 0 4.4s1.8 3 0 4.4"/>
      <path stroke="url(#h)" stroke-width="2.6" d="M40 4c-1.8 1.4-1.8 3 0 4.4s1.8 3 0 4.4"/>
      <path stroke="currentColor" stroke-width="3" d="M12.5 17l2.5 1.6h34l2.5-1.6"/>
      <path stroke="currentColor" stroke-width="3" d="M18.5 22h27v1.5c0 7-5.8 11.5-13.5 11.5s-13.5-4.5-13.5-11.5z"/>
      <path stroke="url(#h)" stroke-width="3" d="M23 49.5l5.5-12 3.5 6 3.5-6 5.5 12"/>
      <path stroke="url(#h)" stroke-width="2.6" d="M19.5 54c0-2.8 1.5-4.4 3.5-4.4s3.5 1.6 3.5 4.4"/>
      <path stroke="url(#h)" stroke-width="2.6" d="M37.5 54c0-2.8 1.5-4.4 3.5-4.4s3.5 1.6 3.5 4.4"/>
    </g>
  </svg>
  <h1>You're offline</h1>
  <p>We can't reach Suya Factory right now. Check your data or Wi‑Fi, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <small>We'll reload by ourselves as soon as you're back online.</small>
</main>
<script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
